name: Inventorier les marchés PropLine
# BET-154 : diagnostic manuel en lecture seule. Aucune écriture dans le dépôt, aucun déploiement.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Nombre maximal de requêtes PropLine (60 au plus)'
        default: '56'
        type: string
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relever les marchés servis par PropLine
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_INVENTORY_BUDGET: ${{ inputs.budget }}
        run: node scripts/propline-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propline-inventory
          path: |
            propline-inventory.json
            propline-inventory.md
          if-no-files-found: ignore
          retention-days: 7
