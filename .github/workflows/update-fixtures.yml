name: Actualiser les matchs

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-fixtures.mjs
      - .github/workflows/update-fixtures.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betmaster-pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser les dernières données
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger les calendriers officiels
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: node scripts/update-fixtures.mjs
      - name: Publier les nouvelles données
        run: |
          git config user.name "betmaster-fixtures[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "chore: actualise les matchs officiels"
          git push
      - name: Configurer la synchronisation des comptes
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/configure-supabase.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déployer le calendrier actualisé
        id: deployment
        uses: actions/deploy-pages@v4
