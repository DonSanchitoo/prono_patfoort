<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes alertes · Aperçu fictif</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../styles/components.css"></head><body style="padding:24px 16px"><nav style="max-width:820px;margin:0 auto 28px;display:flex;gap:20px;align-items:center"><b>BETOPTIMUM</b><span class="muted">Aperçu fictif · aucun envoi</span><button id="theme" class="button secondary">Changer de thème</button></nav><main id="preview"></main><script type="module">
import {mountNotifications} from '../notification-page.js';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let preferences={enabled:false,channels:[],daily_briefing:false,favorite_briefing:false,briefing_minute:660,timezone:'Europe/Paris',min_value:.05,min_confidence:.6,max_per_hour:3,teams:[],leagues:[]};
const api={load:async()=>({preferences,plan:{id:'free'},endpoints:['email'],history:[]}),save:async p=>{preferences=p},unsubscribe:async()=>{preferences={...preferences,enabled:false,channels:[],daily_briefing:false}},action:async()=>({available:{email:true},queued:true})};
await mountNotifications(document.querySelector('#preview'),{api,html:escape,toast:()=>{}});
document.querySelector('#theme').onclick=()=>document.documentElement.classList.toggle('light');
</script></body></html>
